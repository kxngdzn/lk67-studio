[package]
name = "lk67-studio"
version = "0.2.0"
edition = "2024"
description = "RGB lighting, remap and macro studio for the LK67 65% mechanical keyboard"
license = "MIT"

[dependencies]
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
hidapi = "2.6.7"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
rfd = "0.15"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.27"
wasapi = "0.27.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Devices_HumanInterfaceDevice",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
